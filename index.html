<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
            <title>Holedown MVP</title>
                <style>
                        html, body { margin: 0; padding: 0; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
                                canvas { display: block; touch-action: none; background: #111; }
                                        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; user-select: none; }
                                                #game-over, #restart-btn { position: absolute; left: 50%; transform: translateX(-50%); display: none; }
                                                        #game-over { top: 45%; font-size: 3rem; color: #f33; }
                                                                #restart-btn { top: 55%; font-size: 1.5rem; padding: 0.5em 1em; cursor: pointer; background: #f33; color: #000; border: none; border-radius: 4px; pointer-events: all; }
                                                                        #score { position: absolute; top: 10px; left: 10px; font-size: 1.5rem; color: #fff; }
                                                                            </style>
                                                                            </head>
                                                                            <body>
                                                                                <canvas></canvas>
                                                                                    <div id="ui-container">
                                                                                            <div id="score"></div>
                                                                                                    <div id="game-over">Game Over</div>
                                                                                                            <button id="restart-btn">Restart</button>
                                                                                                                </div>

                                                                                                                <script>
                                                                                                                (() => {
                                                                                                                        // --- SETUP ---
                                                                                                                            const canvas = document.querySelector('canvas');
                                                                                                                                const ctx = canvas.getContext('2d');
                                                                                                                                    const gameOverUI = document.getElementById('game-over');
                                                                                                                                        const restartBtn = document.getElementById('restart-btn');
                                                                                                                                            const scoreUI = document.getElementById('score');

                                                                                                                                                let W, H, blockSize;
                                                                                                                                                    const ROW_COUNT = 7;
                                                                                                                                                        const BALL_SPEED = 8;
                                                                                                                                                            const BALL_RADIUS = 5;

                                                                                                                                                                // --- GAME STATE ---
                                                                                                                                                                    let blocks, balls;
                                                                                                                                                                        let ballCount, score;
                                                                                                                                                                            let aimAngle;
                                                                                                                                                                                let canShoot, turnInProgress, gameOver;
                                                                                                                                                                                    let ballShootIndex, ballShootTimer;
                                                                                                                                                                                        let shooterX;

                                                                                                                                                                                            function init() {
                                                                                                                                                                                                        resize();
                                                                                                                                                                                                                blocks = [];
                                                                                                                                                                                                                        balls = [];
                                                                                                                                                                                                                                ballCount = 5;
                                                                                                                                                                                                                                        score = 0;
                                                                                                                                                                                                                                                aimAngle = -Math.PI / 2;
                                                                                                                                                                                                                                                        canShoot = true;
                                                                                                                                                                                                                                                                turnInProgress = false;
                                                                                                                                                                                                                                                                        gameOver = false;
                                                                                                                                                                                                                                                                                shooterX = W / 2;

                                                                                                                                                                                                                                                                                        gameOverUI.style.display = 'none';
                                                                                                                                                                                                                                                                                                restartBtn.style.display = 'none';
                                                                                                                                                                                                                                                                                                        scoreUI.textContent = score;

                                                                                                                                                                                                                                                                                                                addNewRow();
                                                                                                                                                                                                                                                                                                                        gameLoop();
                                                                                                                                                                                            }
                                                                                                                                                                                                
                                                                                                                                                                                                    function resize() {
                                                                                                                                                                                                                W = window.innerWidth;
                                                                                                                                                                                                                        H = window.innerHeight;
                                                                                                                                                                                                                                canvas.width = W;
                                                                                                                                                                                                                                        canvas.height = H;
                                                                                                                                                                                                                                                blockSize = W / ROW_COUNT;
                                                                                                                                                                                                    }

                                                                                                                                                                                                        // --- GAME LOGIC ---
                                                                                                                                                                                                            function addNewRow() {
                                                                                                                                                                                                                        if (gameOver) return;
                                                                                                                                                                                                                                score++;
                                                                                                                                                                                                                                        scoreUI.textContent = score;

                                                                                                                                                                                                                                                // Move existing blocks down
                                                                                                                                                                                                                                                        blocks.forEach(b => b.y += blockSize);
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                        // Check for game over condition *after* moving blocks
                                                                                                                                                                                                                                                                                if (blocks.some(b => b.y + blockSize > H)) {
                                                                                                                                                                                                                                                                                                endGame();
                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                        // Add a new row at the top
                                                                                                                                                                                                                                                                                                for (let i = 0; i < ROW_COUNT; i++) {
                                                                                                                                                                                                                                                                                                                if (Math.random() < 0.7) { // 70% chance of a block appearing
                                                                                                                                                                                                                                                                                                                                blocks.push({
                                                                                                                                                                                                                                                                                                                                                        x: i * blockSize,
                                                                                                                                                                                                                                                                                                                                                                            y: 0,
                                                                                                                                                                                                                                                                                                                                                                                                w: blockSize,
                                                                                                                                                                                                                                                                                                                                                                                                                    h: blockSize,
                                                                                                                                                                                                                                                                                                                                                                                                                                        hp: score // HP scales with the score/turn number
                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                            }

                                                                                                                                                                                                                function shootBalls() {
                                                                                                                                                                                                                            if (!canShoot || turnInProgress || gameOver) return;
                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                            turnInProgress = true;
                                                                                                                                                                                                                                                    canShoot = false;
                                                                                                                                                                                                                                                            ballShootIndex = 0;

                                                                                                                                                                                                                                                                    ballShootTimer = setInterval(() => {
                                                                                                                                                                                                                                                                                    if (ballShootIndex >= ballCount) {
                                                                                                                                                                                                                                                                                                        clearInterval(ballShootTimer);
                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                balls.push({
                                                                                                                                                                                                                                                                                                                    x: shooterX,
                                                                                                                                                                                                                                                                                                                                    y: H - 20,
                                                                                                                                                                                                                                                                                                                                                    vx: Math.cos(aimAngle) * BALL_SPEED,
                                                                                                                                                                                                                                                                                                                                                                    vy: Math.sin(aimAngle) * BALL_SPEED
                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                            ballShootIndex++;
                                                                                                                                                                                                                                                                    }, 120); // 120ms delay between balls
                                                                                                                                                                                                                }

                                                                                                                                                                                                                    function endGame() {
                                                                                                                                                                                                                                gameOver = true;
                                                                                                                                                                                                                                        gameOverUI.style.display = 'block';
                                                                                                                                                                                                                                                restartBtn.style.display = 'block';
                                                                                                                                                                                                                                                        clearInterval(ballShootTimer);
                                                                                                                                                                                                                    }
                                                                                                                                                                                                                        
                                                                                                                                                                                                                            // --- UPDATE & DRAW ---
                                                                                                                                                                                                                                function update() {
                                                                                                                                                                                                                                            if (gameOver) return;

                                                                                                                                                                                                                                                    balls.forEach(ball => {
                                                                                                                                                                                                                                                                    ball.x += ball.vx;
                                                                                                                                                                                                                                                                                ball.y += ball.vy;

                                                                                                                                                                                                                                                                                            // Wall collisions
                                                                                                                                                                                                                                                                                                        if (ball.x - BALL_RADIUS < 0) { ball.x = BALL_RADIUS; ball.vx *= -1; }
                                                                                                                                                                                                                                                                                                                    if (ball.x + BALL_RADIUS > W) { ball.x = W - BALL_RADIUS; ball.vx *= -1; }
                                                                                                                                                                                                                                                                                                                                if (ball.y - BALL_RADIUS < 0) { ball.y = BALL_RADIUS; ball.vy *= -1; }

                                                                                                                                                                                                                                                                                                                                            // Block collisions (the key fix)
                                                                                                                                                                                                                                                                                                                                                        for (let i = blocks.length - 1; i >= 0; i--) {
                                                                                                                                                                                                                                                                                                                                                                            const block = blocks[i];
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                            const closestX = Math.max(block.x, Math.min(ball.x, block.x + block.w));
                                                                                                                                                                                                                                                                                                                                                                                                                            const closestY = Math.max(block.y, Math.min(ball.y, block.y + block.h));
                                                                                                                                                                                                                                                                                                                                                                                                                                            const dx = ball.x - closestX;
                                                                                                                                                                                                                                                                                                                                                                                                                                                            const dy = ball.y - closestY;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (dx * dx + dy * dy < BALL_RADIUS * BALL_RADIUS) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // Collision detected
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        block.hp--;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Eject ball to prevent getting stuck & calculate bounce
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const overlapX = BALL_RADIUS - Math.abs(dx);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const overlapY = BALL_RADIUS - Math.abs(dy);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (overlapX < overlapY) { // Horizontal collision
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ball.vx *= -1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ball.x += ball.vx > 0 ? overlapX : -overlapX;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                } else { // Vertical collision
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ball.vy *= -1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ball.y += ball.vy > 0 ? overlapY : -overlapY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (block.hp <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    blocks.splice(i, 1);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            break; // A ball hits only one block per frame
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                            // Filter out balls that have fallen off the bottom
                                                                                                                                                                                                                                                                    const returningBalls = balls.filter(b => b.y - BALL_RADIUS < H);
                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                    // Check if the turn has ended
                                                                                                                                                                                                                                                                                            if (turnInProgress && balls.length > 0 && returningBalls.length === 0) {
                                                                                                                                                                                                                                                                                                            shooterX = balls[0].x; // Set next shooter position to where first ball landed
                                                                                                                                                                                                                                                                                                                        if (shooterX < BALL_RADIUS) shooterX = BALL_RADIUS;
                                                                                                                                                                                                                                                                                                                                    if (shooterX > W - BALL_RADIUS) shooterX = W - BALL_RADIUS;

                                                                                                                                                                                                                                                                                                                                                balls = [];
                                                                                                                                                                                                                                                                                                                                                            turnInProgress = false;
                                                                                                                                                                                                                                                                                                                                                                        canShoot = true;
                                                                                                                                                                                                                                                                                                                                                                                    addNewRow();
                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                            balls = returningBalls;
                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                    function draw() {
                                                                                                                                                                                                                                                ctx.clearRect(0, 0, W, H);

                                                                                                                                                                                                                                                        // Draw Aim Line
                                                                                                                                                                                                                                                                if (canShoot && !turnInProgress) {
                                                                                                                                                                                                                                                                                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                                                                                                                                                                                                                                                                                            ctx.lineWidth = 2;
                                                                                                                                                                                                                                                                                                        ctx.beginPath();
                                                                                                                                                                                                                                                                                                                    ctx.moveTo(shooterX, H - 20);
                                                                                                                                                                                                                                                                                                                                ctx.lineTo(shooterX + Math.cos(aimAngle) * 60, H - 20 + Math.sin(aimAngle) * 60);
                                                                                                                                                                                                                                                                                                                                            ctx.stroke();
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                        // Draw Blocks
                                                                                                                                                                                                                                                                                ctx.textAlign = 'center';
                                                                                                                                                                                                                                                                                        ctx.textBaseline = 'middle';
                                                                                                                                                                                                                                                                                                ctx.font = `${Math.round(blockSize / 3)}px sans-serif`;
                                                                                                                                                                                                                                                                                                        blocks.forEach(b => {
                                                                                                                                                                                                                                                                                                                        ctx.fillStyle = `hsl(0, 0%, ${15 + b.hp * 2}%)`; // Color slightly changes with HP
                                                                                                                                                                                                                                                                                                                                    ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
                                                                                                                                                                                                                                                                                                                                                ctx.fillStyle = '#fff';
                                                                                                                                                                                                                                                                                                                                                            ctx.fillText(b.hp, b.x + b.w / 2, b.y + b.h / 2);
                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                // Draw Balls
                                                                                                                                                                                                                                                                                                                        ctx.fillStyle = '#0ff';
                                                                                                                                                                                                                                                                                                                                balls.forEach(b => {
                                                                                                                                                                                                                                                                                                                                                ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                            ctx.arc(b.x, b.y, BALL_RADIUS, 0, Math.PI * 2);
                                                                                                                                                                                                                                                                                                                                                                        ctx.fill();
                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                // Draw Shooter position
                                                                                                                                                                                                                                                                                                                                                        if (canShoot && !turnInProgress) {
                                                                                                                                                                                                                                                                                                                                                                        ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                                                                                                                                                                                                                                                                                                                                                                                    ctx.beginPath();
                                                                                                                                                                                                                                                                                                                                                                                                ctx.arc(shooterX, H - 20, BALL_RADIUS + 2, 0, Math.PI * 2);
                                                                                                                                                                                                                                                                                                                                                                                                            ctx.fill();
                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                        function gameLoop() {
                                                                                                                                                                                                                                                    update();
                                                                                                                                                                                                                                                            draw();
                                                                                                                                                                                                                                                                    if (!gameOver) {
                                                                                                                                                                                                                                                                                    requestAnimationFrame(gameLoop);
                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                            // --- EVENT HANDLERS ---
                                                                                                                                                                                                                                                let isAiming = false;

                                                                                                                                                                                                                                                    function getAimAngle(e) {
                                                                                                                                                                                                                                                                const rect = canvas.getBoundingClientRect();
                                                                                                                                                                                                                                                                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                                                                                                                                                                                                                                                                                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                                                                                                                                                                                                                                                                                        const dx = (clientX - rect.left) - shooterX;
                                                                                                                                                                                                                                                                                                const dy = (clientY - rect.top) - (H - 20);
                                                                                                                                                                                                                                                                                                        let angle = Math.atan2(dy, dx);
                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                        // Clamp angle to the upper hemisphere
                                                                                                                                                                                                                                                                                                                                if (angle > -0.1) angle = -0.1;
                                                                                                                                                                                                                                                                                                                                        if (angle < -Math.PI + 0.1) angle = -Math.PI + 0.1;
                                                                                                                                                                                                                                                                                                                                                return angle;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                        function onPointerDown(e) {
                                                                                                                                                                                                                                                                    if (!canShoot || turnInProgress || gameOver) return;
                                                                                                                                                                                                                                                                            isAiming = true;
                                                                                                                                                                                                                                                                                    aimAngle = getAimAngle(e);
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                            function onPointerMove(e) {
                                                                                                                                                                                                                                                                        if (!isAiming) return;
                                                                                                                                                                                                                                                                                aimAngle = getAimAngle(e);
                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                function onPointerUp(e) {
                                                                                                                                                                                                                                                                            if (!isAiming) return;
                                                                                                                                                                                                                                                                                    isAiming = false;
                                                                                                                                                                                                                                                                                            shootBalls();
                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                    // --- INITIALIZE ---
                                                                                                                                                                                                                                                                        window.addEventListener('resize', resize);
                                                                                                                                                                                                                                                                            restartBtn.addEventListener('click', init);
                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                    canvas.addEventListener('mousedown', onPointerDown);
                                                                                                                                                                                                                                                                                        canvas.addEventListener('mousemove', onPointerMove);
                                                                                                                                                                                                                                                                                            canvas.addEventListener('mouseup', onPointerUp);
                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
                                                                                                                                                                                                                                                                                                        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
                                                                                                                                                                                                                                                                                                            canvas.addEventListener('touchend', onPointerUp);
                                                                                                                                                                                                                                                                                                                canvas.addEventListener('touchcancel', onPointerUp);

                                                                                                                                                                                                                                                                                                                    init();
                                                                                                                })();
                                                                                                                </script>
